name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const releaseTag = process.env.RELEASE_TAG;
          const expectedTag = `v${packageJson.version}`;
          const lockVersions = [packageLock.version, packageLock.packages?.['']?.version];

          if (!/^v\d+\.\d+\.\d+$/.test(releaseTag)) {
            throw new Error(`Release tag ${releaseTag} must use the v<major>.<minor>.<patch> format.`);
          }
          if (releaseTag !== expectedTag) {
            throw new Error(`Release tag ${releaseTag} does not match package.json version ${expectedTag}.`);
          }
          if (lockVersions.some((version) => version !== packageJson.version)) {
            throw new Error('package.json and package-lock.json must contain the same version.');
          }

          console.log(`Preparing ${packageJson.name} ${packageJson.version}.`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: xvfb-run --auto-servernum -- npm test

      - name: Package VSIX
        run: npm run vsix

      - name: Verify VSIX package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            printf 'Expected exactly one VSIX in dist, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          asset="${packages[0]}"
          expected_name="$(node -e 'const packageJson = require("./package.json"); process.stdout.write(`${packageJson.name}-${packageJson.version}.vsix`);')"
          if [[ "$(basename "$asset")" != "$expected_name" ]]; then
            printf 'Expected VSIX filename %s, found %s.\n' "$expected_name" "$(basename "$asset")" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(unzip -p "$asset" extension/package.json | node -e 'let data = ""; process.stdin.on("data", (chunk) => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version));')"
          if [[ "$manifest_version" != "$package_version" ]]; then
            printf 'VSIX manifest version %s does not match package.json version %s.\n' "$manifest_version" "$package_version" >&2
            exit 1
          fi

          echo "Verified $asset for version $package_version."
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VSIX_ASSET: ${{ steps.package.outputs.asset }}
        run: gh release create "$RELEASE_TAG" "$VSIX_ASSET" --title "$RELEASE_TAG" --generate-notes --verify-tag
